name: Renewal and transaction regressions

on:
  push:
    branches: [main]
    paths:
      - app/Services/TransactionOperator.php
      - app/Services/TransactionLogger.php
      - app/Services/SubscriptionReservation*.php
      - app/Services/UserBot/UserBotReservationGuard.php
      - database/migrations/2026_10_29_000001_create_subscription_reservations.php
      - tests/Feature/SubscriptionReservationTest.php
      - tests/Feature/ReservationConcurrencyTest.php
      - app/Services/SubscriptionOrderPolicy.php
      - app/Services/PanelAccountActionService.php
      - app/Http/Controllers/Api/BillingController.php
      - app/Http/Controllers/Api/PanelController.php
      - app/Http/Controllers/Api/V2UserController.php
      - app/Http/Controllers/Api/Admin/UserAdminController.php
      - tests/Feature/TransactionOperatorTest.php
      - tests/Feature/RenewalExpiryTest.php
      - .github/workflows/transactions.yml
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, gd, zip, dom
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Transaction operator persistence and billing/history parity
        run: php vendor/bin/phpunit tests/Feature/TransactionOperatorTest.php
      - name: Integrated renewal origin and usage-setting regressions
        run: |
          if [ -f tests/Feature/RenewalExpiryTest.php ]; then
            php vendor/bin/phpunit tests/Feature/RenewalExpiryTest.php
          fi

      - name: Reservation lifecycle and payment regressions
        run: php vendor/bin/phpunit tests/Feature/SubscriptionReservationTest.php
      - name: Real concurrent purchases
        run: |
          dbfile=$(mktemp /tmp/speedbox-reservation-XXXXXXXX.sqlite)
          DB_CONNECTION=sqlite DB_DATABASE="$dbfile" php vendor/bin/phpunit tests/Feature/ReservationConcurrencyTest.php
