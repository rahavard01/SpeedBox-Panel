name: Panel SpeedBox CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: speedbox-test
          MYSQL_DATABASE: speedbox_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pspeedbox-test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, pdo_mysql, gd, zip, dom
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - name: PHP syntax
        run: find app config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php artisan test --testsuite=Unit
      - name: SpeedBox integration tests
        run: php artisan test --filter=SpeedboxInfrastructureTest
      - name: WARP API and host preparation tests
        run: |
          php artisan test --filter=NodeWarpTest
          python3 scripts/tests/node-warp-host.test.py
      - name: Tunnel API, paired rollback and artifact verification
        run: |
          php artisan test --filter='TunnelManagementTest|TrustedTunnelOriginTest|AccountTopupParityTest'
          python3 scripts/verify-backpack.py
          php scripts/tests/tunnel-alerts-and-tags.test.php
          php scripts/tests/tunnel-runtime.test.php
          php scripts/tests/network-preflight.test.php
          php scripts/tests/tunnel-cdn.test.php
          python3 scripts/tests/tunnel-cdn-host.test.py
          python3 scripts/tests/tunnel-certificate.test.py
          python3 scripts/tests/tunnel-cdn-live.test.py
          python3 scripts/verify-tunnel-cdn.py
      - name: Direct SSH command and upload
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo python3 scripts/tests/ssh-route.test.py --php "$(command -v php)"
      - name: Preventive runtime regression
        run: php scripts/tests/preventive-runtime.test.php
      - name: Preventive MySQL renewals and concurrent admission
        env:
          SPEEDBOX_TEST_MYSQL_PORT: '3306'
          SPEEDBOX_TEST_MYSQL_USER: root
          SPEEDBOX_TEST_MYSQL_PASSWORD: speedbox-test
        run: |
          php scripts/tests/online-presence.test.php --mysql
          php scripts/tests/preventive-runtime.test.php --mysql --timed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Network tunnel engines and form regressions
        run: |
          python3 scripts/verify-wattunnel.py
          python3 scripts/tests/wattunnel-host.test.py
          node scripts/verify-gost.mjs
          node scripts/tests/network-tunnel-form.test.mjs
          python3 scripts/tests/network-host.test.py
          python3 scripts/tests/network-probe.test.py
          sudo python3 scripts/tests/network-probe-worker.test.py
      - name: Production UI regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-deps" --no-save --package-lock=false jsdom@30.1.3
          export SPEEDBOX_TEST_JSDOM="$RUNNER_TEMP/ui-deps/node_modules/jsdom/lib/api.js"
          node --experimental-vm-modules scripts/tests/online-presence-ui.test.mjs
          node --experimental-vm-modules scripts/tests/user-experience-ui.test.mjs
          node scripts/tests/removal-ui.test.mjs
          node scripts/tests/certificate-dns.test.mjs
          node scripts/tests/subscription-guide.test.mjs
      - name: Build tunnel UI fixtures
        timeout-minutes: 4
        run: |
          npm ci
          npm run build
      - name: Prepare tunnel browser
        timeout-minutes: 15
        run: |
          npm install --prefix "$RUNNER_TEMP/tunnel-ui" --no-save --package-lock=false playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "SPEEDBOX_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/tunnel-ui/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Tunnel navigation and progress UI
        timeout-minutes: 3
        run: |
          export SPEEDBOX_TEST_PLAYWRIGHT="$RUNNER_TEMP/tunnel-ui/node_modules/playwright/index.mjs"
          node scripts/tests/tunnel-navigation.test.mjs
          node scripts/tests/tunnel-cdn-ui.test.mjs
      - name: Fresh MySQL installation
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: speedbox_ci
          DB_USERNAME: root
          DB_PASSWORD: speedbox-test
        run: php artisan migrate --force

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Use the verified bundled WatTunnel in source-identity tests
        run: |
          python3 ../scripts/verify-wattunnel.py
          gzip -dc ../wattunnel-dist/wattun-linux-amd64.gz > "$RUNNER_TEMP/speedbox-wattun"
          chmod 700 "$RUNNER_TEMP/speedbox-wattun"
          echo "SPEEDBOX_TEST_WATTUN=$RUNNER_TEMP/speedbox-wattun" >> "$GITHUB_ENV"
      - run: go test ./internal/...
      - run: make build-all
      - uses: actions/upload-artifact@v4
        # Only release-agent consumes these archives, and it runs on version tags.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: speedbox-agent-linux
          path: |
            agent/xboard-node-linux-*
            agent/xbctl-linux-*

  release-agent:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [panel, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: speedbox-agent-linux
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*


